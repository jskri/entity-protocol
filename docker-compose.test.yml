services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
      POSTGRES_DB: server_test
    ports:
      - "5433:5432"    # different host port to avoid conflict with the dev db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server"]
      interval: 5s
      timeout: 5s
      retries: 5
