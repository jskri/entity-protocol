services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
      POSTGRES_DB: server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://server:server@db:5432/server
      PORT: "8888"
    ports:
      - "8888:8888"
